[project]
name = "wordle"
version = "0.1.0"
description = "Wordle Solver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.2.2",
    "pandas>=2.3.3",
    "psycopg>=3.3.4",
    "scipy>=1.15.1",
    "sqlparams>=6.2.0",
    "sqlparse>=0.5.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: exercises the real word lists; regression baseline for speed work"]
