[project]
name = "wordle"
version = "0.1.0"
description = "Wordle Solver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2.2",
    "scipy>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: exercises the real word lists; regression baseline for speed work"]
